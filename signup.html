<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — BlogSphere AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                ✨ BlogSphere <span class="logo-badge">AI</span>
            </a>
            <div class="nav-actions" id="navActions"></div>
        </div>
    </nav>

    <!-- Signup Container -->
    <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
        <div class="editor-card" style="width: 100%; max-width: 500px; padding: 2.5rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Create Your Account</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Join our community of AI-powered writers & readers</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Alex Morgan" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="alexmorgan" required minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="alex@blogsphere.ai" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 8 chars, 1 uppercase, 1 digit" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Short Bio (Optional)</label>
                    <textarea id="bio" class="form-control" style="min-height: 80px;" placeholder="Tell the community about yourself..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">
                    Create Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const bio = document.getElementById('bio').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const res = await api.register({ full_name: fullName, username, email, password, bio });
                if (res.success) {
                    showToast('🎉 Account created! Welcome to BlogSphere AI!', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    showToast(res.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast(err.message || 'Error creating account', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
